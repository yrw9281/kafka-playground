apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: kafka
  namespace: kafka-poc
spec:
  serviceName: kafka
  replicas: 3
  selector:
    matchLabels:
      app: kafka
  template:
    metadata:
      labels:
        app: kafka
    spec:
      tolerations:
      - key: node-role.kubernetes.io/control-plane
        operator: Exists
        effect: NoSchedule
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            podAffinityTerm:
              labelSelector:
                matchLabels:
                  app: kafka
              topologyKey: kubernetes.io/hostname
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
      containers:
      - name: kafka
        image: apache/kafka:3.9.1
        command:
        - /bin/bash
        - -ec
        - |
          export KAFKA_NODE_ID="$(( ${HOSTNAME##*-} + 1 ))"
          export KAFKA_ADVERTISED_LISTENERS="PLAINTEXT://${HOSTNAME}.kafka:9092"
          if [ "$KAFKA_NODE_ID" = "1" ]; then
            export KAFKA_PROCESS_ROLES="broker,controller"
            export KAFKA_LISTENERS="PLAINTEXT://:9092,CONTROLLER://:9093"
          else
            export KAFKA_PROCESS_ROLES="broker"
            export KAFKA_LISTENERS="PLAINTEXT://:9092"
          fi
          exec /etc/kafka/docker/run
        ports:
        - name: broker
          containerPort: 9092
        - name: controller
          containerPort: 9093
        resources:
          requests:
            cpu: 250m
            memory: 768Mi
          limits:
            cpu: "2"
            memory: 2Gi
        env:
        - name: CLUSTER_ID
          value: "MkU3OEVBNTcwNTJENDM2Qk"

        - name: KAFKA_CONTROLLER_QUORUM_VOTERS
          value: "1@kafka-0.kafka:9093"

        - name: KAFKA_LISTENER_SECURITY_PROTOCOL_MAP
          value: "PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT"

        - name: KAFKA_CONTROLLER_LISTENER_NAMES
          value: "CONTROLLER"

        - name: KAFKA_INTER_BROKER_LISTENER_NAME
          value: "PLAINTEXT"

        - name: KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR
          value: "3"

        - name: KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR
          value: "3"

        - name: KAFKA_TRANSACTION_STATE_LOG_MIN_ISR
          value: "2"

        - name: KAFKA_DEFAULT_REPLICATION_FACTOR
          value: "3"

        - name: KAFKA_NUM_PARTITIONS
          value: "3"

        - name: KAFKA_LOG_DIRS
          value: "/var/lib/kafka/data/logs"

        - name: KAFKA_HEAP_OPTS
          value: "-Xms512m -Xmx512m"

        startupProbe:
          tcpSocket:
            port: broker
          periodSeconds: 10
          failureThreshold: 30
        readinessProbe:
          tcpSocket:
            port: broker
          periodSeconds: 10
        livenessProbe:
          tcpSocket:
            port: broker
          periodSeconds: 20
          failureThreshold: 6

        volumeMounts:
        - name: data
          mountPath: /var/lib/kafka/data

  volumeClaimTemplates:
  - metadata:
      name: data
    spec:
      storageClassName: kafka-poc-nfs
      accessModes:
      - ReadWriteOnce
      resources:
        requests:
          storage: 10Gi