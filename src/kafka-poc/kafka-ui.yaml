apiVersion: apps/v1
kind: Deployment
metadata:
  name: kafka-ui
  namespace: kafka-poc
spec:
  replicas: 1
  selector:
    matchLabels:
      app: kafka-ui

  template:
    metadata:
      labels:
        app: kafka-ui

    spec:
      containers:
      - name: kafka-ui

        image: provectuslabs/kafka-ui:v0.7.2

        ports:
        - name: http
          containerPort: 8080

        resources:
          requests:
            cpu: 100m
            memory: 512Mi
          limits:
            cpu: "1"
            memory: 1Gi

        env:
        - name: AUTH_TYPE
          value: DISABLED

        - name: DYNAMIC_CONFIG_ENABLED
          value: "false"

        - name: JAVA_OPTS
          value: "-Xms128m -Xmx512m"

        - name: KAFKA_CLUSTERS_0_NAME
          value: idp-kafka

        - name: KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS
          value: kafka:9092

        startupProbe:
          httpGet:
            path: /actuator/health
            port: http
          periodSeconds: 10
          failureThreshold: 30
        readinessProbe:
          httpGet:
            path: /actuator/health
            port: http
          periodSeconds: 10
        livenessProbe:
          httpGet:
            path: /actuator/health
            port: http
          periodSeconds: 20
          failureThreshold: 6